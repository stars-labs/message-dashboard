[package]
name = "orange-pi-daemon-rust"
version = "1.0.0"
edition = "2021"

[lib]
name = "orange_pi_daemon_rust"
path = "src/lib.rs"

[[bin]]
name = "orange-pi-daemon-rust"
path = "src/main.rs"

[dependencies]
# Async runtime - multi-threaded for concurrent modem processing
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "process"] }

# HTTP client for API calls
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# JSON serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Systemd integration
sd-notify = "0.4"

# Time handling for proper timestamp parsing
chrono = { version = "0.4", features = ["serde", "clock"] }

# UUID for correlation IDs
uuid = { version = "1", features = ["v4"] }

# Native D-Bus communication (eliminates subprocess overhead)
zbus = { version = "4", features = ["tokio"] }

# SQLite for local message storage and queue
rusqlite = { version = "0.30", features = ["bundled", "chrono"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
