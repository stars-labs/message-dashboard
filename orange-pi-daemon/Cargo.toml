[package]
name = "orange-pi-daemon-rust"
version = "8.0.1"
edition = "2021"
# src/bin/ holds throwaway diagnostic tools (at_debug, modem_health,
# test_sms_delete), so bare `cargo run` is ambiguous. Default to the daemon.
default-run = "orange-pi-daemon-rust"

[lib]
name = "orange_pi_daemon_rust"
path = "src/lib.rs"

[[bin]]
name = "orange-pi-daemon-rust"
path = "src/main.rs"

[dependencies]
# Async runtime - multi-threaded for concurrent modem processing
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "process", "net", "io-util", "sync"] }
# Voice bridge: the Cloudflare Realtime adapter connects in over wss://.
# protobuf framing and resampling are hand-written in voice_codec.
tokio-tungstenite = "0.24"
futures-util = "0.3"

# HTTP client for API calls
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# JSON serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Systemd integration
sd-notify = "0.4"

# Time handling for proper timestamp parsing
chrono = { version = "0.4", features = ["serde", "clock"] }

# UUID for correlation IDs
uuid = { version = "1", features = ["v4"] }

# Native D-Bus communication (eliminates subprocess overhead)
zbus = { version = "4", features = ["tokio"] }

# SQLite for local message storage and queue
rusqlite = { version = "0.30", features = ["bundled", "chrono"] }

# Terminal I/O for direct AT command communication (bypasses ModemManager)
# Using nix for termios - no libudev dependency
# "ioctl" provides the ioctl_none! macro used for USBDEVFS_RESET (modem USB reset)
nix = { version = "0.29", features = ["term", "fs", "ioctl"] }
# Voice bridge TLS: Let's Encrypt via TLS-ALPN-01 on the listener itself, and
# HMAC for adapter paths. ring only — it is already in the tree through reqwest.
ring = "0.17"
rustls-acme = { version = "0.15", default-features = false, features = ["ring", "tokio", "webpki-roots", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

[target.'cfg(target_os = "linux")'.dependencies]
tracing-journald = "0.3.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
