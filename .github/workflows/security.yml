name: Security Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # 1. GitHub CodeQL Analysis for code vulnerabilities
  # Note: Disabled due to conflict with GitHub's default CodeQL setup
  # To re-enable: First disable default setup at https://github.com/stars-labs/message-dashboard/settings/security_analysis
  # codeql:
  #   name: CodeQL Analysis
  #   runs-on: ubuntu-latest
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       language: [ 'javascript' ]
  #   
  #   steps:
  #   - name: Checkout repository
  #     uses: actions/checkout@v4
  #
  #   - name: Initialize CodeQL
  #     uses: github/codeql-action/init@v3
  #     with:
  #       languages: ${{ matrix.language }}
  #       queries: security-and-quality
  #
  #   - name: Autobuild
  #     uses: github/codeql-action/autobuild@v3
  #
  #   - name: Perform CodeQL Analysis
  #     uses: github/codeql-action/analyze@v3
  #     with:
  #       category: "/language:${{matrix.language}}"

  # 2. Dependency vulnerability scanning
  dependency-check:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check for package-lock.json
      id: check-npm
      working-directory: ./sms-dashboard
      run: |
        if [ -f "package-lock.json" ]; then
          echo "has_package_lock=true" >> $GITHUB_OUTPUT
        else
          echo "has_package_lock=false" >> $GITHUB_OUTPUT
        fi

    - name: Run npm audit
      if: steps.check-npm.outputs.has_package_lock == 'true'
      working-directory: ./sms-dashboard
      run: |
        npm audit --production
        npm audit --json > npm-audit-report.json || true

    - name: Upload npm audit results
      if: steps.check-npm.outputs.has_package_lock == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: npm-audit-report
        path: sms-dashboard/npm-audit-report.json

    - name: Check for critical vulnerabilities
      if: steps.check-npm.outputs.has_package_lock == 'true'
      working-directory: ./sms-dashboard
      run: |
        if npm audit --production --audit-level=critical; then
          echo "✅ No critical vulnerabilities found"
        else
          echo "❌ Critical vulnerabilities detected"
          exit 1
        fi
    
    - name: Run bun audit (fallback for bun projects)
      if: steps.check-npm.outputs.has_package_lock == 'false'
      working-directory: ./sms-dashboard
      run: |
        echo "Project uses bun, skipping npm audit as it requires package-lock.json"
        echo "Bun doesn't have a built-in audit command yet"
        # You could add a third-party bun security scanner here if needed

  # 3. Secret scanning with Gitleaks
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for scanning

    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      continue-on-error: true  # Don't fail if license is missing
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE || '' }}

  # 4. Container scanning (for Docker images if you use them)
  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    if: false  # Enable this if you have Docker images
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'your-image:latest'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  # 5. SAST with Semgrep
  semgrep:
    name: Semgrep Security Analysis
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run Semgrep
      id: semgrep
      uses: returntocorp/semgrep-action@v1
      continue-on-error: true
      with:
        config: >-
          p/security-audit
          p/secrets
          p/owasp-top-ten
          p/javascript
          p/typescript

    - name: Upload Semgrep results
      uses: github/codeql-action/upload-sarif@v3
      if: steps.semgrep.outputs.sarif != '' && always()
      with:
        sarif_file: results.sarif

  # 6. License compliance check
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Check for package manager
      id: check-pm
      working-directory: ./sms-dashboard
      run: |
        if [ -f "package-lock.json" ]; then
          echo "pm=npm" >> $GITHUB_OUTPUT
        elif [ -f "bun.lockb" ] || [ -f "bun.lock" ]; then
          echo "pm=bun" >> $GITHUB_OUTPUT
        else
          echo "pm=unknown" >> $GITHUB_OUTPUT
        fi

    - name: Install dependencies for npm
      if: steps.check-pm.outputs.pm == 'npm'
      working-directory: ./sms-dashboard
      run: npm ci --production

    - name: Install dependencies for bun
      if: steps.check-pm.outputs.pm == 'bun'
      working-directory: ./sms-dashboard
      run: bun install --production

    - name: Install license-checker
      if: steps.check-pm.outputs.pm == 'npm'
      run: npm install -g license-checker

    - name: Check licenses with npm
      if: steps.check-pm.outputs.pm == 'npm'
      working-directory: ./sms-dashboard
      run: |
        license-checker --production --summary --out license-report.json
        license-checker --production --onlyAllow 'MIT;ISC;BSD;Apache-2.0;CC0-1.0;Unlicense' || {
          echo "⚠️ Found packages with incompatible licenses"
          license-checker --production --exclude 'MIT;ISC;BSD;Apache-2.0;CC0-1.0;Unlicense'
          exit 1
        }

    - name: Check licenses with bun
      if: steps.check-pm.outputs.pm == 'bun'
      working-directory: ./sms-dashboard
      run: |
        echo "Bun license checking is not yet standardized"
        echo "Skipping license check for bun projects"
        # Create a dummy report
        echo '{"status": "skipped", "reason": "bun project"}' > license-report.json

    - name: Upload license report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: license-report
        path: sms-dashboard/license-report.json

  # 7. Infrastructure as Code security
  iac-security:
    name: IaC Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run Checkov
      uses: bridgecrewio/checkov-action@master
      with:
        directory: .
        quiet: true
        framework: all
        output_format: sarif
        output_file_path: checkov-results.sarif
        skip_check: CKV_DOCKER_2,CKV_DOCKER_3  # Skip checks not relevant

    - name: Upload Checkov results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: checkov-results.sarif

    # Note: Comprehensive Nix/NixOS security scanning is handled by .github/workflows/nix-security.yml

  # 8. OWASP Dependency Check
  owasp-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run OWASP Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: 'message-dashboard'
        path: '.'
        format: 'ALL'
        args: >
          --enableRetired
          --enableExperimental

    - name: Upload OWASP results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: owasp-dependency-check-report
        path: reports/

  # 9. Security headers check (for web application)
  security-headers:
    name: Security Headers Check
    runs-on: ubuntu-latest
    if: false  # Enable when you have a deployed URL
    steps:
    - name: Check security headers
      run: |
        # Replace with your actual deployed URL
        URL="https://sexy.qzz.io"
        
        # Check for security headers
        curl -s -I "$URL" | grep -E "(Strict-Transport-Security|X-Frame-Options|X-Content-Type-Options|Content-Security-Policy|X-XSS-Protection)" || {
          echo "⚠️ Missing important security headers"
          exit 1
        }

  # 10. API Security Testing
  api-security:
    name: API Security Testing
    runs-on: ubuntu-latest
    if: false  # Enable when you want to test deployed APIs
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: OWASP ZAP API Scan
      uses: zaproxy/action-api-scan@v0.7.0
      with:
        target: 'https://sexy.qzz.io/api'
        rules_file_name: '.zap/rules.tsv'
        format: openapi
        cmd_options: '-a'

  # Summary job to ensure all checks pass
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-check, secret-scan, semgrep, license-check, iac-security, owasp-check]
    if: always()
    steps:
    - name: Summary
      run: |
        echo "## Security Check Summary"
        echo "✅ All security checks completed"
        echo ""
        echo "### Check Results:"
        echo "- Dependency Check: ${{ needs.dependency-check.result }}"
        echo "- Secret Scan: ${{ needs.secret-scan.result }}"
        echo "- Semgrep: ${{ needs.semgrep.result }}"
        echo "- License Check: ${{ needs.license-check.result }}"
        echo "- IaC Security: ${{ needs.iac-security.result }}"
        echo "- OWASP Check: ${{ needs.owasp-check.result }}"
        
        # Fail if any check failed
        if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
          echo "❌ Some security checks failed"
          exit 1
        else
          echo "✅ All security checks passed"
        fi