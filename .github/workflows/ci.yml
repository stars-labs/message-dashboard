# Gates for every push and pull request. Each job mirrors a local command the
# agent guides already require: `check-daemon` for the Rust daemon, `bun run check`
# (typecheck, lint, test, build) and `bun run e2e` for the dashboard, `check-api-compat` on pull
# requests, and a lint and evaluation of the Nix files so a broken NixOS module is
# caught before a deploy. On main the Pi
# system is also built on an arm64 runner and pushed to Cachix, so the Pi only
# downloads (`pi-deploy <path>`, see docs/deployment.md). Deploys themselves
# stay manual: the Worker through wrangler, the Pi from its own side.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  daemon:
    name: Daemon (check-daemon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-rust-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-rust-${{ runner.os }}-
          gc-max-store-size-linux: 2G
          purge: true
          purge-prefixes: nix-rust-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            orange-pi-daemon/target
          key: cargo-${{ runner.os }}-${{ hashFiles('orange-pi-daemon/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: rustfmt check, strict Clippy, and full test suite
        run: nix develop .#rust -c check-daemon

  # Bun and Node come from the flake's `dashboard` shell, as they do locally.
  dashboard:
    name: Dashboard (bun run check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sms-dashboard
        shell: nix develop ..#dashboard -c bash -e {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check:migrations compares migrations/ with origin/main.
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - run: bun install --frozen-lockfile
      - run: bun run check

  e2e:
    name: Dashboard e2e (bun run e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sms-dashboard
        shell: nix develop ..#dashboard -c bash -e {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - run: bun install --frozen-lockfile
      - run: PLAYWRIGHT_BROWSERS_PATH=0 bunx playwright-core install chromium --no-shell --with-deps
      - run: bun run e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-results
          path: sms-dashboard/e2e-results/

  # The committed openapi.json of the pull request against the base branch's.
  # The dashboard job already fails when that file is not what the contract
  # generates, so comparing the files compares the contracts.
  api-compat:
    name: API compatibility (oasdiff)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Breaking changes against the base branch
        env:
          OASDIFF_FORMAT: githubactions
          BASE_REF: ${{ github.base_ref }}
        run: nix run .#check-api-compat -- "origin/$BASE_REF"

  nixos:
    name: Orange Pi system evaluates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: nixfmt, deadnix and statix on every Nix file
        run: nix build --no-link -L .#checks.x86_64-linux.nix-lint
      - name: actionlint and zizmor (Actions pinned to commit SHAs)
        run: nix run .#check-workflows -- .github/workflows/*.yml
      - name: Evaluate the Pi system closure
        run: nix eval --raw .#nixosConfigurations.orange-pi.config.system.build.toplevel.drvPath

  pi-system:
    name: Orange Pi system (arm64 build, Cachix push)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: xiongchenyu6
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: Build the system closure
        run: |
          out=$(nix build .#nixosConfigurations.orange-pi.config.system.build.toplevel --print-out-paths --no-link)
          echo "OUT=$out" >> "$GITHUB_ENV"
          {
            echo "## Orange Pi system"
            echo
            echo "On the Pi, as root:"
            echo
            echo '```'
            echo "pi-deploy $out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Push what cache.nixos.org does not serve
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then
            echo "CACHIX_AUTH_TOKEN is not set; built only, nothing pushed."
            exit 0
          fi
          # The whole closure would fill the free cache with the kernel and
          # firmware; the Pi gets those from cache.nixos.org anyway.
          nix path-info -r "$OUT" > closure.txt
          ours() {
            hash=$(basename "$1" | cut -c1-32)
            curl -sfI -o /dev/null "https://cache.nixos.org/$hash.narinfo" || echo "$1"
          }
          export -f ours
          xargs -P 32 -I{} bash -c 'ours "$@"' _ {} < closure.txt > push.txt
          echo "closure: $(wc -l < closure.txt) paths, pushing $(wc -l < push.txt)"
          cachix push xiongchenyu6 < push.txt
