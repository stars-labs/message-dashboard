name: Continuous Security Monitoring

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Allow manual triggers

permissions:
  contents: read
  issues: write
  security-events: write

jobs:
  # 1. Create security report issue
  security-report:
    name: Weekly Security Report
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Generate security report
      id: report
      run: |
        echo "## 📊 Weekly Security Report - $(date +'%Y-%m-%d')" > security-report.md
        echo "" >> security-report.md
        
        # NPM audit summary
        echo "### 📦 NPM Dependencies" >> security-report.md
        cd sms-dashboard
        npm audit --json > audit.json || true
        
        if [ -f audit.json ]; then
          VULNS=$(jq '.metadata.vulnerabilities' audit.json)
          echo "- Total vulnerabilities: $(echo $VULNS | jq '.total')" >> ../security-report.md
          echo "- Critical: $(echo $VULNS | jq '.critical')" >> ../security-report.md
          echo "- High: $(echo $VULNS | jq '.high')" >> ../security-report.md
          echo "- Moderate: $(echo $VULNS | jq '.moderate')" >> ../security-report.md
          echo "- Low: $(echo $VULNS | jq '.low')" >> ../security-report.md
        fi
        cd ..
        
        echo "" >> security-report.md
        echo "### 🔍 Code Analysis" >> security-report.md
        echo "- Last CodeQL scan: ${{ github.event.repository.updated_at }}" >> security-report.md
        echo "- Open security alerts: [View alerts](https://github.com/${{ github.repository }}/security/code-scanning)" >> security-report.md
        
        echo "" >> security-report.md
        echo "### 📝 Recommendations" >> security-report.md
        echo "1. Review and update dependencies" >> security-report.md
        echo "2. Check security alerts in GitHub Security tab" >> security-report.md
        echo "3. Run 'npm audit fix' for auto-fixable issues" >> security-report.md
        
        # Set output
        echo "report<<EOF" >> $GITHUB_OUTPUT
        cat security-report.md >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create or update issue
      uses: peter-evans/create-issue-from-file@v5
      with:
        title: "🔐 Weekly Security Report - ${{ steps.report.outputs.date }}"
        content-filepath: ./security-report.md
        labels: |
          security
          automated
          weekly-report

  # 2. Dependency update check
  dependency-updates:
    name: Check for Security Updates
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Check for updates
      working-directory: ./sms-dashboard
      run: |
        npx npm-check-updates --dep prod --target minor -f security

    - name: Create PR for security updates
      uses: peter-evans/create-pull-request@v6
      with:
        title: "🔐 Security dependency updates"
        body: |
          ## Security Dependency Updates
          
          This PR contains security-related dependency updates identified by automated scanning.
          
          ### Changes
          - Updated dependencies with known vulnerabilities
          - Only includes minor and patch updates for stability
          
          ### Testing Required
          - [ ] Run test suite
          - [ ] Manual testing of affected features
          - [ ] Deploy to staging environment
          
          🤖 Generated by security monitoring workflow
        branch: security/dependency-updates
        labels: |
          security
          dependencies
          automated

  # 3. Security scorecard
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Run Scorecard analysis
      uses: ossf/scorecard-action@v2.3.1
      with:
        results_file: scorecard-results.sarif
        results_format: sarif
        publish_results: true

    - name: Upload Scorecard results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: scorecard-results.sarif

  # 4. Monitor for new CVEs
  cve-monitor:
    name: CVE Monitoring
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check for new CVEs
      run: |
        echo "Checking for new CVEs affecting project dependencies..."
        
        # This is a placeholder - in production, you might use:
        # - GitHub Advisory Database API
        # - NVD (National Vulnerability Database) API
        # - OSV (Open Source Vulnerabilities) API
        
        # Example check for critical CVEs
        curl -s "https://api.github.com/advisories?type=reviewed&severity=critical&ecosystem=npm" | \
          jq -r '.[] | select(.published_at > (now - 604800 | strftime("%Y-%m-%d"))) | 
          "⚠️ \(.summary) - Published: \(.published_at)"' || true