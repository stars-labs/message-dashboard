[package]
name = "orange-pi-daemon-rust"
version = "1.0.0"
edition = "2021"

[dependencies]
# Async runtime - single-threaded for simplicity and safety
tokio = { version = "1", features = ["rt", "time", "macros", "process"] }

# HTTP client for API calls
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# JSON serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Systemd integration
sd-notify = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
