<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta id="app-viewport" name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // iOS respects maximum-scale for its automatic input-focus zoom while
      // modern WebKit still permits user-initiated pinch zoom. Keep this iOS-
      // only so other mobile browsers retain their normal zoom semantics.
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
        || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const isStandalone = 'standalone' in navigator
        ? navigator.standalone === true
        : window.matchMedia('(display-mode: standalone)').matches;
      if (isIOS) {
        document.documentElement.classList.add('is-ios');
        document.getElementById('app-viewport')
          .setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0');
      }
      if (isStandalone) {
        document.documentElement.classList.add('is-standalone');
      }
    </script>
    <title>短信验证码管理系统</title>
    <!-- SVG first for crisp scaling; the PNG is the fallback for browsers that
         ignore SVG icons, and apple-touch-icon is the iOS home screen version. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#F97316" />
    <!-- Installing from the manifest launches in standalone display mode, which hides
         the browser chrome — and Safari's pull-to-refresh lives in that chrome. The
         in-app gesture (client/lib/PullToRefresh.svelte) is what replaces it, so it
         has to ship before or with this link, never after. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/client/main.js"></script>
  </body>
</html>
