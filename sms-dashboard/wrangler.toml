name = "sms-dashboard"
main = "server/index.js"
compatibility_date = "2026-03-01"
account_id = "793e3286eaca411bf1eebaf4b8c7051e"

# Routes
workers_dev = true
# routes = [
#   { pattern = "sexy.qzz.io", custom_domain = true }
# ]

# Balance reply correlation and timeout reconciliation runs every five minutes.
# The 04:17 UTC trigger also runs the heavier nightly retention and backfills.
[triggers]
crons = ["*/5 * * * *", "17 4 * * *"]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "sms-dashboard"
database_id = "e6e594a7-9b82-4cff-a369-bad7c0e735f6"
migrations_dir = "migrations"

# KV Namespace for sessions
[[kv_namespaces]]
binding = "SESSIONS"
id = "4d7e71fcf5c44a469aa63e28f60cb6d7"

# Environment variables
[vars]
ENVIRONMENT = "production"
DEFAULT_USER_GROUP = "viewer"
WORKER_URL = "https://sexy.qzz.io"

# Second layer behind the role check: only these email domains may complete login.
# Enforced in server/handlers/auth0.js, which also requires the address to be
# email_verified so an unverified claim from one connection cannot impersonate a
# domain on this list.
ALLOWED_EMAIL_DOMAINS = "poloniex.com,bitgc.io,tron.network,htx-inc.com"

# Auth0 Role Configuration
#
# There is deliberately no USE_AUTH0_ROLES or AUTH0_ALLOW_NO_ROLES switch any more.
# Both existed only to turn authorization off, and production shipped with
# USE_AUTH0_ROLES="false", which granted every authenticated user every permission.
# The gate now fails closed in code; see docs/SECURITY-REVIEW.md finding 1.
# Two roles, defined in config/auth0-roles.js:
#   viewer -> read messages, read the SIM list, send SMS
#   admin  -> everything, including managing other users' roles
# New users are auto-assigned `sms-viewer` on first login (after the verified-email and
# allowed-domain checks pass). Roles are additive and anything unrecognised grants
# nothing, so a session minted before this split re-authenticates.
AUTH0_ADMIN_ROLE = "sms-admin"
AUTH0_VIEWER_ROLE = "sms-viewer"
AUTH0_ROLE_NAMESPACE = "https://sexy.qzz.io/roles"  # FULL claim URI holding the roles array

# wrangler.toml (wrangler v3.88.0^)
[observability.logs]
enabled = true
# No Durable Objects or streaming transport; the client uses request/refresh flows.

# Secrets (set these with wrangler secret put)
# AUTH0_DOMAIN - Your Auth0 domain (e.g., your-tenant.auth0.com)
# AUTH0_CLIENT_ID - Your Auth0 application client ID
# AUTH0_CLIENT_SECRET - Your Auth0 application client secret
# AUTH0_M2M_CLIENT_ID - Auth0 Management API machine-to-machine client ID
# AUTH0_M2M_CLIENT_SECRET - Auth0 Management API machine-to-machine client secret
# AUTH0_AUDIENCE - Required Auth0 API identifier used by web and Balance Agent tokens
# API_KEY - API key for Orange Pi integration
