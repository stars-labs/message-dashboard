name = "sms-dashboard"
main = "server/index.js"
compatibility_date = "2025-08-09"
account_id = "793e3286eaca411bf1eebaf4b8c7051e"

# No compatibility flags needed for 2025-01-09

# Routes
workers_dev = true
# routes = [
#   { pattern = "sexy.qzz.io", custom_domain = true }
# ]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "sms-dashboard"
database_id = "e6e594a7-9b82-4cff-a369-bad7c0e735f6"
migrations_dir = "migrations"

# KV Namespace for sessions
[[kv_namespaces]]
binding = "SESSIONS"
id = "4d7e71fcf5c44a469aa63e28f60cb6d7"

# Environment variables
[vars]
ENVIRONMENT = "production"
DEFAULT_USER_GROUP = "viewer"
WORKER_URL = "https://sexy.qzz.io"
# ALLOWED_EMAIL_DOMAINS = "example.com,partner.com"  # Uncomment to restrict domains

# Auth0 Role Configuration
USE_AUTH0_ROLES = "true"  # Set to "false" to disable role checking
AUTH0_SMS_ROLE = "sms"    # The role that grants SMS access
AUTH0_ALTERNATIVE_SMS_ROLES = ""  # No additional roles needed
AUTH0_ROLE_NAMESPACE = "https://sexy.qzz.io"  # Where to find roles in Auth0 token
AUTH0_ALLOW_NO_ROLES = "false"  # Set to "true" to allow access without roles (testing only)

# wrangler.toml (wrangler v3.88.0^)
[observability.logs]
enabled = true
# Durable Objects removed - using simple SSE instead

# Secrets (set these with wrangler secret put)
# AUTH0_DOMAIN - Your Auth0 domain (e.g., your-tenant.auth0.com)
# AUTH0_CLIENT_ID - Your Auth0 application client ID
# AUTH0_CLIENT_SECRET - Your Auth0 application client secret
# AUTH0_AUDIENCE - Your Auth0 API audience (optional)
# API_KEY - API key for Orange Pi integration
