<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="短信验证码管理系统">
  <title>短信验证码管理系统</title>
  <!--
    An SMS bubble with a check through it: the dashboard exists to surface
    verification codes, so "message" + "verified" is the whole product in one mark.

    Proportions are tuned for 16px, where a tab strip actually shows it — the check
    is stroked at 3.6/32 (~11% of the width) because a thinner mark blurs into a
    featureless blob at that size. The check is painted in the tile's own orange
    rather than a third colour, so the icon stays two-tone and legible when small.

    #F97316 is the app's orange-500, the same accent as the active nav tab and the
    send button, so the favicon matches the UI rather than inventing a palette.
  -->
  <rect width="32" height="32" rx="7" fill="#F97316"/>
  <path fill="#FFFFFF" d="M9.5 5.5h13A5 5 0 0 1 27.5 10.5v6.5a5 5 0 0 1-5 5h-5.7l-4.9 4.5a1.05 1.05 0 0 1-1.77-.78V22h-.13a5 5 0 0 1-5-5v-6.5a5 5 0 0 1 5-5Z"/>
  <path fill="none" stroke="#F97316" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" d="m10.9 13.6 3.2 3.3 6.4-6.5"/>
</svg>
