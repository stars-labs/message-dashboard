# Kernel Parameters for 100 USB Modems
# Add to /etc/sysctl.conf or NixOS configuration

# USB subsystem parameters
usbcore.usbfs_memory_mb=512            # Increased from 256MB
usbcore.authorized_default=1           # Auto-authorize devices
usbcore.autosuspend=-1                 # Disable autosuspend permanently

# File descriptor limits
fs.file-max=1048576                    # Increase system FD limit
fs.nr_open=1048576                     # Per-process FD limit

# Network buffer sizes (for QMI/PPP)
net.core.rmem_max=16777216             # Receive buffer max
net.core.wmem_max=16777216             # Send buffer max
net.core.rmem_default=262144           # Default receive buffer
net.core.wmem_default=262144           # Default send buffer

# Process limits
kernel.pid_max=4194304                 # Increase PID limit
kernel.threads-max=1048576             # Thread limit

# Memory management
vm.min_free_kbytes=65536               # Keep more free memory
vm.swappiness=1                        # Minimize swapping

# IRQ handling
kernel.sched_migration_cost_ns=5000000 # Reduce IRQ migration

# USB-specific timing
usb.hub_reset_timeout=5000             # Hub reset timeout (ms)
usb.device_reset_timeout=5000          # Device reset timeout (ms)

# For ModemManager/QMI
net.ipv4.ip_forward=1                  # Enable IP forwarding
net.ipv4.conf.all.rp_filter=2         # Loose reverse path filtering