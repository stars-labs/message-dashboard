# Optimized ModemManager Configuration for 100 Modems
# Place in /etc/ModemManager/ModemManager.conf

[Service]
# Reduce polling frequency to minimize QMI load
Restart=on-failure
RestartSec=10

[Logging]
# Reduce log verbosity in production
Level=WARN

[Connection]
# Increase timeout values for high-load scenarios
DefaultTimeout=60
QmiTimeout=45

# Device-specific optimizations
[Device]
# Faster enumeration
EnumerationTimeout=30
# Reduce probe attempts
MaxProbeAttempts=2

# QMI-specific settings
[QMI]
# Connection management
QmiConnectionTimeout=30
QmiResponseTimeout=45
# Reduce unnecessary polling
QmiSignalCheckInterval=60
QmiRegistrationCheckInterval=60

# USB-specific optimizations
[USB]
# Faster device detection
USBEnumerationDelay=1
# Reduce reset frequency
USBResetOnProbeFailure=false